[build-system]
requires = ["setuptools==84.2.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pylaia"
version = "1.2.9+fork.20261028"
keywords = ["HTR OCR python"]
readme = "README.md"
authors = [
    {name = "Joan Puigcerver", email = "joapuipe@gmail.com"},
]
maintainers = [
    {name = "tfgdngfxgfb"},
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Programming Language :: Python :: 3.15",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
    "Topic :: Text Processing :: Linguistic",
]
requires-python = ">=3.14,<3.16"
dependencies = [
    "setuptools==84.2.0",
    "imagesize==2.0.1",
    "jsonargparse[signatures]==4.52.0",
    "matplotlib==3.11.2",
    "natsort==8.4.0",
    "pytorch-lightning==2.6.6",
    "scipy==1.18.1",
    "textdistance==4.6.3",
    "torch==2.15.0",
    "torchmetrics==1.9.0",
    "torchvision==0.29.2",
    "mdutils==1.8.1",
    "prettytable==3.18.0",
    "python-bidi==0.6.12",
    "numpy==2.5.4",
    "pillow==13.0.0",
    "filelock==4.2.4",
    "mpmath==1.4.1",
    "sympy==1.14.0+pylaia1",
    "PyYAML==6.0.3",
    "packaging>=23",
    "tqdm>=4.66",
]
license = "MIT AND BSD-2-Clause"
license-files = ["LICENSE", "LICENSE-TORCHAUDIO"]

[project.urls]
Homepage = "https://github.com/tfgdngfxgfb/PyLaia-fork"
Documentation = "https://github.com/tfgdngfxgfb/PyLaia-fork/blob/main/README.md"
Source = "https://github.com/tfgdngfxgfb/PyLaia-fork"
Tracker = "https://github.com/tfgdngfxgfb/PyLaia-fork/issues"

[project.optional-dependencies]
dev = [
    "pre-commit==4.7.0",
    "ruff==0.17.1",
    "build>=1.2",
    "pip-audit==2.10.1",
]
test = [
    "tox==4.67.1",
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "pandas>=2.2",
    "regex>=2024.11.6",
    "tensorboard>=2.18",
    "hypothesis>=6.70,<7",
    # Keep the tested transitive toolchain reproducible in local tests and CI.
    "cachetools==7.2.4",
    "distlib==0.4.4",
    "platformdirs==4.13.5",
    "pluggy==1.7.0",
    "pyproject-api==1.12.0",
    "python-discovery==1.6.4",
    "virtualenv==21.14.11",
    "pip==26.2.2",
    "Markdown==3.11.2",
    "certifi==2026.10.19",
    "xxhash==4.0.2",
    "wcwidth==0.9.3",
]
wandb = ["wandb==0.31.0+pylaia1", "cwevals==0.0.1b2"]
language-model = [
    "torchaudio==2.11.1; python_version < '3.15'",
    "flashlight-text==0.0.7",
    "kenlm==0.3.0",
]

[project.scripts]
pylaia-htr-create-model = "laia.scripts.htr.create_model:main"
pylaia-htr-decode-ctc = "laia.scripts.htr.decode_ctc:main"
pylaia-htr-netout = "laia.scripts.htr.netout:main"
pylaia-htr-train-ctc = "laia.scripts.htr.train_ctc:main"
pylaia-htr-dataset-validate = "laia.scripts.htr.dataset.validate:main"

[tool.setuptools.packages.find]
include = ["laia*"]

[tool.coverage.paths]
source = [
   "laia/",
   "tests/",
   "*/site-packages/",
   "*/lib/python*/site-packages/"
]

[tool.coverage.run]
branch = true
parallel = true

[tool.coverage.report]
show_missing = false
precision = 2

[tool.pytest.ini_options]
pythonpath = "."

[tool.ruff]
target-version = "py314"

[tool.ruff.lint]
select = [
   # pycodestyle
   "E",
   "W",
   # Pyflakes
   "F",
   # Isort
   "I",
   # Invalid pyproject.toml
   "RUF200",
]


ignore = [
   # ambiguous-variable-name
   "E741",
   # line too long
   "E501",
]

[tool.ruff.lint.per-file-ignores]
# unused imports in __init__.py files should either be stored in __all__ or re-exported with an alias
"*/__init__.py" = ["F401", "F403"]

# Wildcards imports are allowed here
"tests/version_test.py" = ["F405", "F403"]
