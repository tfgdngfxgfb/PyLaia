name: PyLaia CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.15'
      - run: python -m pip install pip==26.2.2 pre-commit==4.7.0 ruff==0.17.3
      - run: pre-commit run --all-files
  torch315-windows:
    name: Python 3.15 / windows-2022 (official bindings)
    runs-on: windows-2022
    timeout-minutes: 180
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        id: python
        with:
          python-version: '3.15'
      - name: Install official CPU PyTorch and TorchVision
        run: python -m pip install --no-deps torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Verify plain Torch callbacks and process shutdown
        run: |
          python -I ci/verify_torch_runtime.py --device cpu --verify-official
      - name: Install PyLaia and CPU TorchVision
        run: |
          python ci/build_compatibility.py --install
          python -m pip install '.[test,wandb]'
      - name: Test
        run: python -m pytest --cov=laia --cov-report=term-missing tests
      - name: Test upstream SymPy numerical compatibility
        run: python -m pytest --pyargs sympy.core.tests.test_evalf sympy.utilities.tests.test_lambdify -q
      - name: Build distributable packages
        run: |
          python -m pip install build
          python -m build
      - name: Audit package advisories
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local --skip-editable --progress-spinner off
          python ci/audit_requirements.py --output audit-requirements.txt
          python -m pip_audit --disable-pip --no-deps -r audit-requirements.txt --progress-spinner off
  test:
    name: Python ${{ matrix.python }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
        os: [ubuntu-latest, windows-2022]
        exclude:
          - python: '3.15'
            os: windows-2022
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install official CPU PyTorch
        run: python -m pip install --no-deps torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyLaia and test tools
        run: |
          python ci/build_compatibility.py --install
          python -m pip install '.[test,wandb]'
      - name: Test
        run: python -m pytest --cov=laia --cov-report=term-missing tests
      - name: Test upstream SymPy numerical compatibility
        run: python -m pytest --pyargs sympy.core.tests.test_evalf sympy.utilities.tests.test_lambdify -q
      - name: Build distributable packages
        run: |
          python -m pip install build
          python -m build
      - name: Audit package advisories
        shell: bash
        run: |
          python -m pip install pip-audit==2.10.1
          python -m pip_audit --local --skip-editable --progress-spinner off
          python ci/audit_requirements.py --output audit-requirements.txt
          python -m pip_audit --disable-pip --no-deps -r audit-requirements.txt --progress-spinner off
  language-model:
    needs: torch315-windows
    name: Windows language model / Python ${{ matrix.python }}
    runs-on: windows-2022
    strategy:
      fail-fast: false
      matrix:
        python: ['3.14', '3.15']
    env:
      PYTHONUTF8: '1'
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - name: Install official CPU PyTorch
        run: python -m pip install --no-deps torch==2.15.0 torchvision==0.29.2 --index-url https://download.pytorch.org/whl/cpu
      - name: Install PyLaia
        run: |
          python ci/build_compatibility.py --install
          python -m pip install '.[test]'
      - name: Build and install patched Flashlight and KenLM
        shell: pwsh
        run: ./ci/build-language-model.ps1 -Python python -Install
      - name: Verify language-model decoding
        run: python -m pytest -q tests/decoders/ctc_language_decoder_test.py tests/decoders/flashlight_adapter_test.py
