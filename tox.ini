[tox]
env_list = py315
minversion = 4.67.13

[testenv]
description = run PyLaia tests
package = wheel
extras = test
set_env =
    PIP_CONSTRAINT = {tox_root}/ci/dependency-constraints.txt
    PIP_FIND_LINKS = {tox_root}/dist/python-compatibility
    PYTHONUTF8 = 1
    OMP_NUM_THREADS = 1
    MKL_NUM_THREADS = 1
commands =
    python -m pytest --cov=laia --cov-report=term {posargs:tests}
